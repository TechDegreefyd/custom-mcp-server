# /etc/nginx/sites-available/postgres-mcp
# Replace YOUR_DOMAIN with your actual domain/subdomain e.g. mcp.yourdomain.com

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # SSL certificates (filled in by Certbot automatically)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Anthropic outbound IPs (Claude.ai → your server)
    # Allowlist if you want to restrict to Anthropic only: 160.79.104.0/21
    # allow 160.79.104.0/21;
    # deny all;

    # ── Proxy to MCP server ──────────────────────────────────────────────────
    location /mcp {
        proxy_pass         http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;

        # Required for SSE / Streamable HTTP
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
        proxy_set_header   Cache-Control     'no-cache';
        proxy_set_header   X-Accel-Buffering 'no';
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — SSE needs long-lived connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Buffer settings for streaming
        proxy_buffering    off;
        proxy_cache        off;
    }

    location / {
        return 404;
    }
}
